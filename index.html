<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/filetype-txt.svg">
    <title>Github Link2PDF Resume Builder</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="theme-classic">

    <div class="controls-bar" role="navigation" aria-label="Resume builder controls">
        <div class="theme-group">
            <span class="group-label" id="app-title">Github Link2PDF Resume Builder</span>
        </div>

        <div class="design-group">
            <label for="design-select" class="group-label" data-i18n="resumeDesignLabel">Resume Design:</label>
            <select id="design-select" class="design-select" aria-label="Select resume theme">
                <!-- Designs will be populated dynamically from design-templates.ts -->
            </select>
            <button id="random-design-btn" class="random-design-btn" title="Random Design">🎲 Random</button>
        </div>

        <div class="align-group">
            <span class="group-label" data-i18n="alignmentLabel">Alignment:</span>
            <button class="align-btn active" data-align="left" title="Left">⬅ <span data-i18n="alignLeft">Left</span></button>
            <button class="align-btn" data-align="center" title="Center">↔ <span data-i18n="alignCenter">Center</span></button>
            <button class="align-btn" data-align="justify" title="Justify">≡ <span data-i18n="alignJustify">Justify</span></button>
        </div>

        <div class="import-group" role="search">
            <label for="github-url" class="visually-hidden">GitHub username</label>
            <input type="text" id="github-url" placeholder="GitHub username (e.g. torvalds)" aria-label="GitHub username">
            <button id="import-github" aria-label="Import from GitHub">Import</button>
            <div id="loader" aria-live="polite"></div>
        </div>

        <div class="action-group" role="group" aria-label="Export and analysis actions">
            <button id="save-json" aria-label="Save JSON">Save JSON</button>
            <button id="export-pdf" aria-label="Export PDF">Export PDF</button>
            <button id="ats-check" aria-label="ATS Check">📊 ATS Check</button>
        </div>
    </div>

    <!-- Job-matching toolbar: paste a job description for targeted ATS matching -->
    <div class="job-match-bar">
        <textarea id="job-description" rows="2"
            placeholder="Paste the job description here to match your resume against a specific role (optional)"
            aria-label="Job description"></textarea>
        <button id="job-match-toggle" class="job-match-toggle" type="button" aria-pressed="false" data-i18n="jobMatchToggle">🎯 Job match</button>
    </div>

    <!-- Floating interface language button (above theme toggle) -->
    <div id="lang-toggle-wrap" class="lang-toggle-wrap">
        <div id="lang-menu" class="lang-menu" role="menu" aria-hidden="true">
            <button class="lang-option" data-lang="en" role="menuitem" type="button" title="English" aria-label="English">🇬🇧</button>
            <button class="lang-option" data-lang="ru" role="menuitem" type="button" title="Русский" aria-label="Русский">🇷🇺</button>
            <button class="lang-option" data-lang="ko" role="menuitem" type="button" title="한국어" aria-label="한국어">🇰🇷</button>
        </div>
        <button id="lang-toggle-floating" class="lang-toggle-floating" type="button" title="Change interface language" aria-label="Change interface language" aria-haspopup="menu" aria-expanded="false">🌐</button>
    </div>

    <!-- Theme Toggle Button - Bottom Left Corner -->
    <button id="theme-toggle-floating" class="theme-toggle-floating" title="Toggle theme" aria-label="Toggle theme">🌙</button>

    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <span id="loading-overlay-text">Loading GitHub data...</span>
    </div>

    <!-- Editable hint toast -->
    <div id="editable-hint" class="editable-hint"></div>

    <!-- Main content area with side-by-side layout -->
    <div class="main-content-wrapper">
        <main id="resume-container" contenteditable="true" spellcheck="false" role="main" aria-label="Resume preview"></main>
        
        <!-- ATS Panel - Sticky sidebar -->
        <aside id="ats-panel" class="ats-panel hidden" aria-label="ATS analysis panel">
            <div class="ats-panel-content"></div>
        </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
